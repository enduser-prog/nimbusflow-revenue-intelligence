<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- NimbusFlow: single-file revenue intelligence dashboard. Open in a browser (needs internet for Chart.js and fonts). -->
<title>NimbusFlow | Revenue Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   STYLES
   ============================================================ */
/* Palette, fonts, base */
:root{--bg:#F5F7FA;--card:#FFFFFF;--tx:#182230;--mu:#667085;--bd:#E4E9F0;--navy:#315C85;--blue:#6385A6;--pos:#16836D;--neg:#C45656;--warn:#B7791F;--surf:#F8FAFC;
--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 13px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.num,.v,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}

/* Header (64px) */
header{position:fixed;inset:0 0 auto 0;height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:20}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:28px;height:28px}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.2px;display:block;line-height:1.15}.brand small{color:var(--mu);font-size:11px;display:block}
.ctx{margin-left:18px;padding-left:18px;border-left:1px solid var(--bd);color:var(--mu);font-weight:500}
.ctl{display:flex;align-items:center;gap:14px}.upd{color:var(--mu);font-size:12px;text-align:right;line-height:1.35}.upd b{font-weight:500;color:var(--tx)}
.sel{position:relative}.sel select{appearance:none;font:500 13px var(--sans);color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 32px 8px 12px;cursor:pointer;transition:border-color .12s}
.sel:after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border:solid var(--mu);border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select:hover,.btn:hover{border-color:#C9D2DE}
.btn{font:500 13px var(--sans);color:#fff;background:var(--navy);border:1px solid var(--navy);border-radius:8px;padding:8px 14px;cursor:pointer;transition:background .12s}.btn:hover{background:#274C71}

/* Sidebar (224px) */
aside{position:fixed;top:64px;bottom:0;left:0;width:224px;background-color:#fff;border-right:1px solid var(--bd);padding:18px 14px;overflow:auto}
aside a{position:relative;display:flex;align-items:center;gap:13px;padding:13px 14px;margin-bottom:4px;border-radius:10px;color:var(--mu);font-size:14.5px;font-weight:500;text-decoration:none;transition:background .12s,color .12s}
aside a:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--navy);opacity:0;transition:opacity .12s}
aside a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside a:hover{background:var(--surf);color:var(--tx)}aside a.on{background:#EAF0F6;color:var(--navy);font-weight:600}aside a.on:before{opacity:1}

/* Main (max 1440, padding 28) */
main{margin:64px 0 0 224px;padding:28px}.wrap{max-width:1440px;margin:auto}
h1{font-size:26px;font-weight:650;letter-spacing:-.4px;line-height:1.2}
.sub{color:var(--mu);margin:4px 0 22px;font-size:13px}
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 12px;font-size:12px;font-weight:600;color:var(--mu)}.sec:after{content:"";flex:1;height:1px;background:var(--bd)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-bottom:16px}
.kpi{grid-column:span 3;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:20px;min-width:0}
.kpi.s2{grid-column:span 2}.kpi.s3{grid-column:span 3}.kpi.s4{grid-column:span 4}.kpi.s6{grid-column:span 6}
.kpi .l{color:var(--mu);font-size:12px;font-weight:500;letter-spacing:.1px}
.kpi,.card{transition:box-shadow .15s,border-color .15s}
.kpi:hover,.card:hover{border-color:#D5DCE6;box-shadow:0 2px 6px rgba(24,34,48,.06)}
.kpi .v{font-size:30px;font-weight:500;letter-spacing:-.8px;line-height:1.2;margin:6px 0 4px}.kpi.hero .v{font-size:32px}
.dl{font-size:12px;font-weight:500;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.dl .r{color:var(--mu);font-weight:400}
.up{color:var(--pos)}.dn{color:var(--neg)}.fl{color:var(--mu)}
.kpi canvas{margin-top:10px;height:44px!important}

/* Chart cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{grid-column:span 6;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:20px;min-width:0}
.w4{grid-column:span 4}.w8{grid-column:span 8}.w12{grid-column:span 12}.w6{grid-column:span 6}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.1px}.card p{font-size:12px;color:var(--mu);margin:2px 0 14px}
.box{height:260px;position:relative}.box.t{height:340px}.box.s{height:200px}
.empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;color:var(--mu);font-size:12px;background:var(--surf);border:1px dashed var(--bd);border-radius:6px}
.skel{height:120px;border-radius:8px;background:#EDF1F6;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}

/* Tables: heatmap, matrix, CAC */
.tw{overflow:auto;max-height:560px;border-radius:6px}
.hm{border-collapse:separate;border-spacing:2px;font-size:11px;width:100%}
.hm th{position:sticky;top:0;background:#fff;color:var(--mu);font-weight:500;font-size:11px;padding:4px 2px;z-index:2;white-space:nowrap}
.hm th.r{position:sticky;left:0;top:auto;text-align:left;padding-right:12px;z-index:1;font-family:var(--sans)}
.hm thead th.r{top:0;z-index:3}
.hm td{height:30px;min-width:50px;text-align:center;border-radius:4px;font-family:var(--mono);font-size:11px}
.hm td.na{background:var(--surf);color:#C5CCD6;border:1px dashed var(--bd)}
.hm th.k{color:var(--navy);font-weight:600;background:#EAF0F6;border-radius:4px}
.hm.mx{border-spacing:3px}.hm.mx td{height:36px;min-width:56px;border-radius:6px}.hm.mx td.z{background:var(--surf)}
.leg{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:11px;margin-top:10px}.leg i{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#EEF3F8,#315C85)}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{position:sticky;top:0;background:var(--bg);color:var(--mu);font-size:11px;font-weight:600;height:40px;padding:0 12px;text-align:right;border-bottom:1px solid #E8EDF2}
.dt td{height:42px;padding:0 12px;border-bottom:1px solid #E8EDF2;text-align:right}.dt th:first-child,.dt td:first-child{text-align:left;font-family:var(--sans);font-weight:500}
.dt tbody tr{transition:background .1s}.dt tbody tr:hover{background:#F7F9FC}
.hi{color:var(--warn);font-weight:500}.tag{font:500 10px var(--sans);color:var(--warn);background:#FBF3E4;border-radius:4px;padding:1px 6px;margin-right:6px}
.pb{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}.pb i{display:block;height:6px;border-radius:3px;background:var(--blue);opacity:.75}
.defs{margin-top:28px;padding-top:16px;border-top:1px solid var(--bd);color:var(--mu);font-size:11.5px;line-height:1.7;max-width:110ch}.defs b{color:var(--tx);font-weight:600}

main{position:relative;z-index:1}
.kpi{box-shadow:0 1px 2px rgba(24,34,48,.04)}
.card{box-shadow:0 1px 2px rgba(24,34,48,.04)}
.card.hero{box-shadow:0 1px 2px rgba(24,34,48,.05);padding:24px}
.card.hero .l{color:var(--mu);font-size:12px;font-weight:500}
.card.hero .v{font-family:var(--mono);font-size:32px;font-weight:500;letter-spacing:-.8px;line-height:1.2;margin:6px 0 4px}
.card.hero .box{margin-top:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:6px}.ph span{color:var(--mu);font-size:12px}
.defs summary{cursor:pointer;font-weight:600;color:var(--tx);font-size:12px;width:max-content}.defs[open] summary{margin-bottom:8px}
.card h3{margin-bottom:12px}.card h3+p{margin:-9px 0 12px}
/* Responsive */
@media(max-width:1100px){.kpi,.kpi.s2,.kpi.s3,.kpi.s4,.kpi.s6{grid-column:span 6}.card,.w4,.w8,.w6{grid-column:span 12}}
@media(max-width:860px){aside{position:static;width:auto;display:flex;overflow-x:auto;padding:8px 12px;margin-top:64px;border-right:0;border-bottom:1px solid var(--bd)}aside a{white-space:nowrap}aside a:before{left:0;top:auto;bottom:0;height:3px;width:auto;right:0;border-radius:3px 3px 0 0}main{margin:0;padding:18px 16px}.ctx,.upd,.brand small{display:none}header{padding:0 14px}}
@media(max-width:560px){.kpi,.kpi.s2,.kpi.s3,.kpi.s4,.kpi.s6{grid-column:span 12}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
